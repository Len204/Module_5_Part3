# Module 5 Part 3 - Pixel River Financial - NGINX API gateway
# /api/transactions/<userId> -> transactions:3000    JavaScript / Express microservice
# /api/...                   -> backend:5000         Python / Flask banking API
# everything else            -> studentportfolio:80  Static HTML front end

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Log that shows which container handled each request (upstream=...)
    log_format routed '$remote_addr [$time_local] "$request" $status '
                      'upstream=$upstream_addr';
    access_log /var/log/nginx/access.log routed;

    upstream backend_service {
        server backend:5000;
    }

    upstream transactions_service {
        server transactions:3000;
    }

    upstream frontend_service {
        server studentportfolio:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Transactions microservice (JavaScript) - only when a user ID follows the slash,
        # e.g. /api/transactions/6739a1f2c4e5b7d8a9f01234
        # Regex locations (~) are checked before prefix locations like /api/.
        # /api/transactions and /api/transactions/ (no ID) fall through to Flask below,
        # which the dashboard's "View Transactions" button uses for the logged-in user.
        location ~ ^/api/transactions/[^/]+$ {
            proxy_pass http://transactions_service;   # passes the full /api/transactions/:userId path
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Banking API (Flask) - register, login, dashboard, deposit, withdraw, logout, transactions
        location /api/ {
            proxy_pass http://backend_service;        # keeps /api/... in the path (Flask routes use /api/)
            proxy_set_header Host $host;              # Flask redirects go back to http://localhost/...
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static/UI - everything else goes to the student portfolio container
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
